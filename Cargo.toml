[workspace]
resolver = "2"
members = ["crates/edax-golden", "crates/edax-core", "crates/edax-event", "crates/edax-cqrs", "crates/edax-py", "crates/edax", "crates/edax-adapters", "crates/edax-abi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/crtomirmajer/edax"

[workspace.dependencies]
edax-golden = { path = "crates/edax-golden" }
edax-core = { path = "crates/edax-core" }
edax-event = { path = "crates/edax-event" }
edax-cqrs = { path = "crates/edax-cqrs" }
edax-adapters = { path = "crates/edax-adapters" }
edax = { path = "crates/edax" }
serde = { version = "1", features = ["derive"] }
