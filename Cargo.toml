[workspace]
resolver = "2"
members = ["crates/edax-golden", "crates/edax-core", "crates/edax-event", "crates/edax-cqrs", "crates/edax-py", "crates/edax", "crates/edax-memory", "crates/edax-kafka", "crates/edax-redis", "crates/edax-abi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crtomirmajer/edax"

[workspace.dependencies]
edax-golden = { path = "crates/edax-golden" }
edax-core = { path = "crates/edax-core" }
edax-event = { path = "crates/edax-event" }
edax-cqrs = { path = "crates/edax-cqrs" }
edax-memory = { path = "crates/edax-memory" }
edax-kafka = { path = "crates/edax-kafka" }
edax-redis = { path = "crates/edax-redis" }
edax = { path = "crates/edax" }
serde = { version = "1", features = ["derive"] }
