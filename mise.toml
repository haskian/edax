# The Rust toolchain is NOT declared here. `rust-toolchain.toml` is alef-generated and already
# pins the channel plus the components (`rust-src`, `rustfmt`, `clippy`); mise reads it as an
# idiomatic version file. A version pinned here as well sets RUSTUP_TOOLCHAIN to a *different*
# toolchain, which overrides that file and drops clippy, so CI fails on a component the repo
# already asks for.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
uv = "latest"
"cargo:maturin" = "1.14.0"
# alef generates `crates/edax-py/src/lib.rs` and the `_edax.pyi` stub from `edax-abi`; pinned to the
# version `alef.toml` declares, so a regeneration here matches CI's freshness check. It comes from
# the prebuilt GitHub release binary. A `cargo:` install compiles it beside maturin, and the two
# parallel builds race on the same rustup download, which broke CI setup.
"github:xberg-io/alef" = "0.103.12"
"aqua:cocogitto/cocogitto" = "7.0.0"  # `cog`: conventional-commit version bumps in CI
"aqua:astral-sh/ruff" = "0.16.7"
"aqua:astral-sh/ty" = "0.0.80"
