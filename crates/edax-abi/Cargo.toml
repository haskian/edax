[package]
name = "edax-abi"
# A literal, not `version.workspace`: alef reads the generated binding's version straight out of this
# file (`version_from` in /alef.toml), so it must be a plain string here.
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flat, plain-Rust API surface over the edax kernels — the source alef extracts to generate native bindings"

[dependencies]
edax-core.workspace = true
edax-event.workspace = true
edax-cqrs.workspace = true
edax-adapters.workspace = true
serde_json = "1"
