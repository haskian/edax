[package]
name = "edax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference model of the edax SDK in Rust: an executable specification of the seams, not a deployable SDK"
# A reference model, not a product: nothing publishes it and nothing depends on it. It holds the Python SDK's
# orchestration to the kernels from a second language. See docs/stability.md.
publish = false

[dependencies]
edax-core.workspace = true
edax-cqrs.workspace = true
edax-event.workspace = true
edax-memory.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `edax::testkit`: the fixtures and the store contract clauses, for an adopter's own store tests.
testkit = ["edax-event/testkit"]

[dev-dependencies]
# Itself with `testkit`, so the integration suites run the contract clauses an adopter runs. The unit
# suites' fixtures start from the kernel's base event, which the feature brings in too.
edax = { workspace = true, features = ["testkit"] }
edax-golden.workspace = true
proptest = "1"

[lints]
workspace = true
