repository.workspace = true
description = "Command-and-query consistency kernel of edax: canonical JSON, command hash, received and claim keys, idempotency record, protected fingerprints and results, ledger fence (complete_fence, release_fence, Claimed), host values, filter, query"

[dependencies]
edax-seal.workspace = true
edax-event.workspace = true
edax-core.workspace = true
serde.workspace = true
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
serde_json_canonicalizer = "0.3.2"
bigdecimal.workspace = true
jiff.workspace = true

[dev-dependencies]
edax-golden.workspace = true
proptest = "1"

[lints]
workspace = true
