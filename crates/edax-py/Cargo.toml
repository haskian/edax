[package]
name = "edax-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native binding for the edax kernels"

[lib]
name = "_edax"
crate-type = ["cdylib"]

# `src/lib.rs` is generated by alef from the `edax-abi` surface (see /alef.toml). Regenerate with
# `mise run bindings:generate`, which runs `alef generate --lang python,ffi,go --clean` and refreshes the
# `_edax.pyi` stub. Without `--clean`, a cache hit skips this file but still runs cleanup, which
# deletes it. Do not edit it by hand. Only the deps the generated code references
# live here: the surface crate, pyo3, and serde for the generated record types. The surface has no
# `async fn`, so alef emits no async runtime and none is linked.
[dependencies]
edax-abi = { path = "../edax-abi" }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
