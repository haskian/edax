[package]
name = "edax-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native binding for the edax kernels"

[lib]
name = "_edax"
crate-type = ["cdylib"]

# `src/lib.rs` is generated by alef from the `edax-abi` surface (see /alef.toml). Regenerate with
# `alef generate --lang python --clean` — without `--clean` a cache hit skips re-emitting this file
# but still runs cleanup, deleting it. Do not edit it by hand. Only the deps the generated code references
# live here: the surface crate, pyo3, the async bridge, and serde for the generated record types.
[dependencies]
edax-abi = { path = "../edax-abi" }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
# The generated module init builds an explicit multi-thread Tokio runtime (alef >= 0.86), so tokio is
# referenced directly here.
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
