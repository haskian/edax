[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "edax"
# Read from `crates/edax-py/Cargo.toml`, which inherits the workspace version. One version literal
# for the whole repo instead of a copy here that a bump has to remember to rewrite.
dynamic = ["version"]
description = "Polyglot event-sourcing toolkit"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["event-sourcing", "cqrs", "idempotency", "outbox", "saga", "kafka"]
authors = [{ name = "Crtomir Majer" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.20.0",
]

[project.optional-dependencies]
# Tech-specific adapters over a caller-owned client; install the extra to pull the client library.
redis = ["redis>=8"]              # edax.backend.redis: 8 keeps a reply's error prefix in `status_code`
kafka = ["aiokafka>=0.8"]         # edax.backend.kafka
postgres = ["asyncpg>=0.30"]      # edax.backend.postgres: 0.30 ships wheels for Python 3.13
test = ["pytest", "pytest-asyncio", "hypothesis"]

[project.urls]
Homepage = "https://github.com/haskian/edax"
Repository = "https://github.com/haskian/edax"
Documentation = "https://github.com/haskian/edax/tree/main/docs"
Issues = "https://github.com/haskian/edax/issues"

[tool.maturin]
module-name = "edax._edax"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
