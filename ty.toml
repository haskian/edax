# Type checking for the Python SDK, its tests, and the examples.

[environment]
# The SDK is a maturin project: the package lives under `python/`, not at the repo root, and
# `_edax` is a compiled extension only present in the venv the extension was built into.
# `tests/` is a root too: the suites import shared fixtures as `from conftest import ...`,
# which pytest resolves by rootdir but a type checker will not guess.
root = ["crates/edax-py/python", "crates/edax-py/tests"]
python = "crates/edax-py/.venv"
# The floor the package actually supports (abi3-py310, requires-python >=3.10), not whatever the
# local interpreter happens to be — otherwise a 3.11-only construct type-checks here and breaks
# for a user on 3.10.
python-version = "3.10"

[src]
include = ["crates/edax-py/python", "crates/edax-py/tests", "examples/py"]
exclude = [
    # alef-generated from crates/edax-abi; never hand-edited, so a diagnostic here is not actionable.
    "crates/edax-py/python/edax/_edax.pyi",
]

[analysis]
# The broker and Redis backends wrap a client the caller owns and installs through an extra
# (`edax[kafka]`, `[redis]`). The base package deliberately depends on none of them, so they are
# absent from a plain checkout. An unresolved import here is the design, not a mistake.
allowed-unresolved-imports = ["aiokafka", "aiokafka.**", "redis", "redis.**"]

[rules]
# A suppression ty no longer needs hides the next real error on that line.
unused-ignore-comment = "error"
