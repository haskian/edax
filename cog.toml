# Conventional-commit versioning. `cog bump` writes CHANGELOG.md and creates the tag; which
# increment it is handed comes from version.yml, not from `--auto`. The policy is in AGENTS.md.

# `v`-prefixed, because release.yml triggers on `v*`.
tag_prefix = "v"

# A bump is only ever cut from main; a stray run on a branch must not create a tag.
branch_whitelist = ["main"]

# Merge commits carry no conventional type of their own, and their contents are already
# counted through the commits they bring in.
ignore_merge_commits = true

# The bump commit is pushed back to main and would otherwise re-trigger CI on a tree CI
# just passed.
skip_ci = "[skip ci]"

# A bump must rewrite the version literals in the tree, or the tag says 0.1.0 while every artefact
# still says 0.0.1. `cargo check` re-locks the workspace so `Cargo.lock` lands in the bump commit
# rather than dirtying the next one.
#
# Deliberately not `--locked`: Cargo.lock records the members' own versions, so set_version.py has
# just made it stale, and `--locked` exists to forbid exactly the update that has to happen here.
# It failed every bump at the hook, before any tag was cut.
pre_bump_hooks = [
    "python3 scripts/set_version.py {{version}}",
    "cargo check --workspace --quiet",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "crtomirmajer"
repository = "edax"

# `versionbump!` is how a major is cut (see AGENTS.md). It has to be declared: cog refuses an
# unregistered type outright, and its grammar rejects a hyphen, so `version-bump!` cannot parse.
[commit_types]
versionbump = { changelog_title = "Major version bump" }
