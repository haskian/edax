name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the full suite before publishing

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: ./.github/workflows/rust.yml
  go:
    uses: ./.github/workflows/go.yml
  # Regenerate the Python extension and stub, C interface and Go facade together.
  # A changed ABI must reach both SDKs. Run this once, outside the runtime matrices.
  binding:
    name: alef freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test binding and release tooling
        run: |
          mise exec -- go -C .mise test ./...
          mise exec -- go -C .mise vet ./...
      - name: Regenerate the binding
        run: mise run bindings:generate
      - name: The committed binding is what alef generates
        run: |
          git diff --exit-code crates/edax-py/src/lib.rs crates/edax-py/python/edax/_edax.pyi \
            crates/edax-abi-ffi crates/edax-go/internal/native crates/edax-go/internal/kernel/native.gen.go crates/edax-go/internal/kernel/error_codes.gen.go \
            crates/edax-go/error_codes.gen.go

  # `requires-python = ">=3.10"` is a promise the suite has to keep. The floor is where a
  # syntax or typing feature added later breaks first; the ceiling is where a dependency or a
  # deprecation breaks first. Testing only the middle catches neither.
  python:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    uses: ./.github/workflows/python.yml
    with:
      python-version: ${{ matrix.python-version }}
