name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the full suite before publishing

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: ./.github/workflows/rust.yml

  # `requires-python = ">=3.9"` is a promise the suite has to keep. The floor is where a
  # syntax or typing feature added later breaks first; the ceiling is where a dependency or a
  # deprecation breaks first. Testing only the middle catches neither.
  python:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    uses: ./.github/workflows/python.yml
    with:
      python-version: ${{ matrix.python-version }}
