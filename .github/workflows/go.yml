name: Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache-key: go
      - name: Build the native library
        run: mise run go:build
      - name: Test with the race detector
        working-directory: crates/edax-go
        run: mise exec -- go test -race ./...
      - name: Vet
        working-directory: crates/edax-go
        run: mise exec -- go vet ./...
      - name: Smoke-test examples
        run: mise run examples:go
      - name: Check handwritten Go formatting
        run: |
          unformatted=$(mise exec -- gofmt -l crates/edax-go .mise)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

  live-examples:
    name: Go examples (Redis + Kafka)
    runs-on: ubuntu-latest
    env:
      EDAX_REDIS_URL: redis://localhost:6379/0
      EDAX_KAFKA_BOOTSTRAP: localhost:9092
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache-key: go-examples
      - name: Build the native library
        run: mise run go:build
      - name: Smoke-test live examples
        run: mise run examples:go 16_redis_ledger 17_kafka
