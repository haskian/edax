name: Python

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image for the job.
        type: string
        default: ubuntu-latest
      python-version:
        description: Interpreter uv provisions for the venv. pyproject declares >=3.10.
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  # Lint and type-check need no native extension, so they run beside the test job rather than
  # gating it — a style error should not wait on a release build of the Rust kernel.
  lint:
    name: ruff + ty
    runs-on: ${{ inputs.runs-on }}
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/crates/edax-py/.venv
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # ty resolves `edax` from this venv, so it must exist and hold the runtime deps the SDK
      # imports. The compiled `_edax` is not needed: its types come from the committed stub.
      - name: Create venv
        working-directory: crates/edax-py
        run: |
          mise exec -- uv venv --python ${{ inputs.python-version }}
          mise exec -- uv pip install msgspec pytest pytest-asyncio hypothesis "redis>=8" "fakeredis[lua]" "aiokafka>=0.8"

      - name: Lint
        run: mise exec -- ruff check .

      # The tree is `ruff format`-clean; the one table that must stay one-case-per-row carries a
      # `# fmt: skip`, so this check and the layout cannot drift apart. See `[format]` in ruff.toml.
      - name: Format
        run: mise exec -- ruff format --check .

      - name: Type-check
        run: mise exec -- ty check

      # Documentation regressions: long sentences, crates/...:NNN citations, banned idioms.
      - name: Lint the documentation
        run: python3 scripts/doclint.py

      # Adopters copy documentation snippets verbatim, so the complete programs among them are held
      # to the same type check as the SDK. Opt-in per fence, with `<!-- doclint: check -->`: most
      # fences are fragments by design and would need a prelude to resolve at all. `--extract` exits
      # non-zero when no fence carries the marker, so a marker lost in an edit fails here.
      - name: Type-check the documentation snippets
        run: |
          python3 scripts/doclint.py --extract .doclint
          mise exec -- ty check --python crates/edax-py/.venv \
            --extra-search-path crates/edax-py/python .doclint/*.py

  test:
    name: pytest
    runs-on: ${{ inputs.runs-on }}
    env:
      # maturin develop installs into the venv named here; exporting it means no `activate`.
      VIRTUAL_ENV: ${{ github.workspace }}/crates/edax-py/.venv
      # The Redis suites run against fakeredis always, and against this live server as well.
      EDAX_REDIS_URL: redis://localhost:6379/0
      # The Kafka suites run against the in-tree Kafka-shaped fake always, and the live module against
      # this broker as well. The pause and restart tests need EDAX_KAFKA_CONTAINER, so they skip here.
      EDAX_KAFKA_BOOTSTRAP: localhost:9092
    # A service container needs a Linux runner, which every caller of this workflow uses.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache-key: python

      - name: Create venv
        working-directory: crates/edax-py
        run: mise exec -- uv venv --python ${{ inputs.python-version }}

      - name: Install test dependencies
        working-directory: crates/edax-py
        run: mise exec -- uv pip install msgspec pytest pytest-asyncio hypothesis mypy "redis>=8" "fakeredis[lua]" "aiokafka>=0.8"

      # THIS STEP IS LOAD-BEARING. pytest never rebuilds the native module: without it the
      # suite imports a stale _edax and passes green while proving nothing about the Rust
      # side. Any change under edax-core/-event/-cqrs/-memory/-kafka/-redis/-abi needs this
      # first.
      - name: Build the native extension
        working-directory: crates/edax-py
        run: mise exec -- maturin develop --release

      # The shipped `_edax.pyi` against the module just built: a name, a parameter or a default the
      # stub claims and the module lacks fails here, where `ty` would accept the call. The allowlist
      # holds alef's own conventions only.
      - name: Check the stub against the module
        working-directory: crates/edax-py
        run: .venv/bin/python -m mypy.stubtest edax._edax --allowlist stubtest-allowlist.txt

      - name: Test
        run: crates/edax-py/.venv/bin/python -m pytest crates/edax-py/tests -q

      # Every example ends in asserts and prints a final `ok:` line. They run in this job rather than
      # beside the linters because they import the compiled extension built above. The exit code
      # counts: the extension starts no runtime of its own, so nothing is left to crash at shutdown.
      - name: Examples
        run: |
          for f in examples/py/*.py; do
            echo "--- $f"
            out=$(crates/edax-py/.venv/bin/python "$f")
            echo "$out"
            echo "$out" | grep -q '^ok:' || { echo "FAILED: $f did not reach its ok: marker"; exit 1; }
          done
