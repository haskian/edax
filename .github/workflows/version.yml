name: Version

# On push to main: a conventional-commit SemVer bump (cog) writes CHANGELOG.md and cuts the
# root and Go module tags, then release.yml runs for the root tag.
# Source version tags are public; this workflow uploads no distribution artifacts.
#
# Requires main to accept pushes from github-actions[bot] — either a bot bypass on the branch
# protection rule, or an unprotected main. Without it the bump commit cannot land and the job
# fails at the push, not at the bump.
#
# Requires merges to stay squash-only as well. That is what makes one commit on main equal one PR
# title, so the title CI verified is the subject the increment is read from. A merge or rebase
# merge puts unverified subjects on main.
on:
  push:
    branches: [main]

# Never two bumps at once: the second would compute its next version from a tag the first has
# not pushed yet, and both would claim the same one.
concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write # push the bump commit, the changelog and the tag back to main

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog reads every commit back to the last tag
          token: ${{ secrets.GITHUB_TOKEN }}

      # Which increment the commits imply is pure git, so it is decided before the toolchain is
      # installed: a push that implies no release skips the install.
      - id: increment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First run on a repo with no root version tags: anchor v0.0.0 at the root commit so the first
          # real bump measures only the commits that followed it, not the whole history.
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -1)"
            git push origin v0.0.0
          fi

          # Chosen here rather than by `cog bump --auto`, which majors on any `feat!` or
          # `BREAKING CHANGE:` footer. The policy in AGENTS.md is narrower: only `versionbump!`
          # cuts a major, and everything else is capped at minor however breaking it claims to be.
          #
          # Subjects, because merges are squash-only: one commit on main is one PR title, the same
          # string the PR-title check verified. Merge commits carry no type of their own.
          subjects="$(git log --no-merges --format=%s "$(git describe --tags --match 'v[0-9]*' --abbrev=0)..HEAD")"
          marked='(\([^)]*\))?'    # optional scope, shared by all three so the grammar is written once

          # A `versionbump:` that forgot its `!` means a major was intended. Silently shipping
          # "no release" would leave the break untagged, so it is an error rather than a miss.
          if grep -qE "^versionbump$marked:" <<<"$subjects"; then
            echo "::error title=Missing \`!\`::A major is spelled \`versionbump!:\`. Retag the commit or amend the subject."
            exit 1
          fi

          if   grep -qE "^versionbump$marked!:" <<<"$subjects"; then increment=--major
          elif grep -qE "^feat$marked!?:"       <<<"$subjects"; then increment=--minor
          elif grep -qE "^fix$marked!?:"        <<<"$subjects"; then increment=--patch
          else increment=""
          fi
          echo "increment=$increment" >> "$GITHUB_OUTPUT"

      - if: steps.increment.outputs.increment != ''
        uses: ./.github/actions/setup

      # No release-worthy commit since the last tag (docs, chore, ci, refactor, perf) is a normal
      # outcome. cog's exit code cannot report it, because cog exits 0 whether it bumped or not.
      - id: bump
        env:
          INCREMENT: ${{ steps.increment.outputs.increment }}
        run: |
          set -euo pipefail
          if [ -z "$INCREMENT" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::No commit since the last tag implies a version bump."
            exit 0
          fi
          mise exec -- cog bump "$INCREMENT" --skip-ci
          version="$(mise exec -- cog get-version)"
          tag="v$version"
          go_tag="$(mise -q run version:check-go -- "$version")"
          git tag "$go_tag" "refs/tags/$tag^{commit}"
          # Publish the commit and both version names together, or publish none.
          git push --atomic origin HEAD:main "refs/tags/$tag" "refs/tags/$go_tag"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # A dispatch creates a release.yml run on the tag. PyPI trusted publishing does
  # not accept release.yml as the publisher when it runs through workflow_call.
  release:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release workflow on the tag
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.version }}
