name: Release

# Both tag pushes and version.yml dispatches build the tagged tree.
# PyPI publishing stays disabled until PYPI_PUBLISH_ENABLED is true.
on:
  push:
    tags: ["v*"]
  # GITHUB_TOKEN tag pushes start no workflows. A dispatch creates a separate run,
  # so PyPI sees release.yml as the publisher instead of a reusable workflow caller.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_REF: ${{ github.ref_name }}

jobs:
  # Publishing an artifact that fails its own test suite is not worth the convenience.
  ci:
    uses: ./.github/workflows/ci.yml

  # A wheel whose version disagrees with its tag cannot be unpublished — PyPI refuses to reuse a
  # filename even after a delete. The tree is what decides that version (maturin reads the Cargo
  # version; pyproject.toml declares it dynamic), so the tree is what gets checked, before the
  # matrix runs. Catches a hand-pushed tag, which never ran mise run version:set.
  version:
    name: Tag matches the tree
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The version checker needs Go, not the Rust build toolchain.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: jdx/mise-action@v4
        with:
          install_args: go
          cache: true
      - run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$BUILD_REF" != v* ]]; then
            echo "::error::Run this workflow on a v-prefixed release tag."
            exit 1
          fi
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "$declared" != "${BUILD_REF#v}" ]; then
            echo "::error::$BUILD_REF was cut from a tree declaring $declared — run the bump, do not tag by hand"
            exit 1
          fi
          mise -q run version:check-go -- "$declared"
          echo "$BUILD_REF matches the tree"

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: [ci, version]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # One unsupported platform must not cancel the wheels that did build.
      fail-fast: false
      matrix:
        include:
          # Built in maturin's manylinux/musllinux containers. A bare `maturin build` on the
          # runner produces a `linux_x86_64` tag, which PyPI rejects on upload, so a tag would
          # publish nothing installable for Linux.
          - { name: linux-x86_64, runs-on: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runs-on: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musl-x86_64, runs-on: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musl-aarch64, runs-on: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, runs-on: macos-latest, target: aarch64 }
          - { name: macos-x86_64, runs-on: macos-latest, target: x86_64 }
          - { name: windows-x64, runs-on: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      # Not ./.github/actions/setup: maturin-action owns the toolchain here, because it has to
      # cross-compile and to run inside the manylinux container. It reads rust-toolchain.toml.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          # abi3-py310, so one wheel per platform covers every interpreter the package supports.
          args: --release --out dist --manifest-path crates/edax-py/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/edax-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # An artifact that cannot be installed is worse than no artifact: it fails in the adopter's
  # environment rather than here. The wheel is abi3, so the floor and the ceiling of the
  # supported range must both accept the same file.
  smoke:
    name: Install (${{ matrix.runs-on }}, py${{ matrix.python-version }})
    needs: [wheels, sdist]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # msgspec is a runtime dependency, so it has to come from the index. `--no-index` is only
      # there to stop *edax* resolving to a PyPI release that happens to share this version, so the
      # dependency is installed first and the wheel install finds it already satisfied. No floor
      # here: pyproject.toml declares it, and the check is that the wheel's metadata agrees.
      - name: Install the wheel
        shell: bash
        run: |
          pip install msgspec
          pip install --no-index --find-links dist edax
      - name: Import it and call the kernel
        shell: bash
        # Exercises the native module, not just the Python package: a wheel whose extension does
        # not load for this interpreter imports fine until the first kernel call.
        run: |
          python -c "
          import edax
          assert edax.backoff_millis(0) == 100
          assert edax.partition('acct-1', 4) < 4
          bus = edax.CommandBus()
          print('edax', edax.__file__, 'ok')
          "

  # The sdist is the fallback for any platform without a wheel, so it has to build from source
  # against a stock toolchain. Separate from `smoke` because it needs Rust and takes minutes.
  sdist-builds:
    name: Install from sdist
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      # Installed by path, not by name: that is what guarantees the sdist under test is the one
      # just built, so the index stays open for the dependencies it needs: maturin to build it
      # (`--no-index` would block the build backend too) and msgspec to import it. A `.tar.gz` is a
      # source install by definition, so `--no-binary` says nothing extra.
      - name: Build and install from source
        shell: bash
        run: |
          pip install dist/edax-*.tar.gz
          python -c "import edax; assert edax.backoff_millis(1) == 200; print('sdist ok')"

  release:
    name: GitHub Release
    needs: [smoke, sdist-builds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish:
    name: Publish to PyPI
    needs: [smoke, sdist-builds]
    runs-on: ubuntu-latest
    # GitHub creates missing environments without protection rules. The repository
    # variable is the explicit opt-in; configure the pypi environment before enabling it.
    if: github.repository == 'haskian/edax' && vars.PYPI_PUBLISH_ENABLED == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/edax
    permissions:
      # Trusted publishing: no long-lived PyPI token in secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The sdist ships too: without it, a platform with no wheel cannot install at all.
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
