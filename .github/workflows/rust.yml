name: Rust

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image for the job.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check:
    name: clippy + tests
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache-key: rust

      # -D warnings fails the job on any new warning.
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings

      # Also covers the golden vectors in testdata/golden, which are the cross-language
      # contract: a kernel change that moves them fails here rather than silently in a
      # second SDK. The proptest model suite runs at its committed case counts; raise
      # them with PROPTEST_CASES for a deeper sweep.
      - name: Test
        run: mise exec -- cargo test --workspace

      # Every public item states what it promises, so a broken intra-doc link (an item a split moved
      # out of scope, or one since removed) fails the job like a compile error.
      - name: Docs
        run: mise exec -- cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The canonical form (idempotency hashes, cursors) must not depend on serde_json features an
      # adopter's build can switch on. This crate replays the golden vectors with them enabled; it is
      # its own workspace, so the features never reach the build above.
      - name: Canonical form under serde_json features
        run: mise exec -- cargo test --manifest-path crates/edax-cqrs/feature-check/Cargo.toml
