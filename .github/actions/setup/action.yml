name: Set up toolchain
description: Install the mise-pinned toolchain (Rust, uv, maturin, the alef release binary) and restore the cargo cache.

inputs:
  cargo-cache-key:
    description: Suffix for the cargo cache, so jobs compiling different feature sets do not evict each other.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        # mise installs Rust through rustup, which its own cache handles badly
        # (jdx/mise-action#215), so cargo artifacts are cached separately below.
        cache: true
      env:
        # mise refuses to read an untrusted config; the checkout is the config we mean to trust.
        MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cargo-cache-key }}

    # The toolchain comes from the alef-generated rust-toolchain.toml, which mise reads as an
    # idiomatic version file; mise.toml deliberately does not pin rust. Clippy is printed as
    # well as rustc because a components mismatch only shows up when a component is *used*:
    # a missing clippy fails the lint step minutes in, where it reads as a lint failure.
    - shell: bash
      run: |
        mise exec -- rustc --version
        mise exec -- cargo clippy --version
