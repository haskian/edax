# Both bindings come from the synchronous edax-abi surface.
# Python output is the native _edax extension. Its generated package scaffold stays in
# crates/edax-py/.alef so it cannot overwrite the handwritten SDK.
# mise run bindings:generate copies the generated stub beside the Python package.
#
# Go output is internal/native. Alef also generates its C interface in edax-abi-ffi.
# .mise/cmd/go-facade adds typed errors and synchronized handle ownership.
# The Go SDK calls that facade. mise run go:build stages the native static library.
# Alef's generated download helpers are ignored because no Go native archives ship yet.
#
# Use mise run bindings:generate for every regeneration. --clean prevents an incremental
# cache hit from leaving stale or deleted output. Alef also emits crates/edax-abi-py/Cargo.toml;
# that scaffold manifest stays outside the workspace and is never built.

[workspace]
languages = ["python", "ffi", "go"]
alef_version = "0.106.1"

[workspace.scaffold]
repository = "https://github.com/haskian/edax"

# Alef fixes the Go hook root at packages/go. This repository owns its hook paths.
[workspace.ownership]
user_owned = ["poly.toml"]

[workspace.package_metadata]
repository = "https://github.com/haskian/edax"
license = "MIT"

[[crates]]
name = "edax-abi"
core_import = "edax_abi"
# Every module of the ABI crate, not only its root: alef follows `mod` + `pub use` from `lib.rs`
# either way, but it fingerprints only the files listed here, so a module left out would let the
# generation record go stale unnoticed.
sources = [
  "crates/edax-abi/src/lib.rs",
  "crates/edax-abi/src/primitives.rs",
  "crates/edax-abi/src/event.rs",
  "crates/edax-abi/src/seal.rs",
  "crates/edax-abi/src/retry.rs",
  "crates/edax-abi/src/saga.rs",
  "crates/edax-abi/src/cqrs.rs",
  "crates/edax-abi/src/memory.rs",
  "crates/edax-abi/src/kafka.rs",
  "crates/edax-abi/src/redis.rs",
  "crates/edax-abi/src/postgres.rs",
]
version_from = "crates/edax-abi/Cargo.toml"

[crates.output]
python = "crates/edax-py/src"
ffi = "crates/edax-abi-ffi/src"
go = "crates/edax-go/internal/native"

[crates.python]
module_name = "_edax"
pip_name = "edax"
scaffold_output = "crates/edax-py/.alef"

[crates.python.stubs]
output = "crates/edax-py/.alef"

[crates.ffi]
prefix = "edax"
header_name = "edax.h"
lib_name = "edax_abi_ffi"

[crates.go]
module = "github.com/haskian/edax/crates/edax-go"
package_name = "native"

[crates.go.link_flags]
darwin = ["-framework", "Security", "-framework", "CoreFoundation", "-lresolv"]
linux = ["-ldl", "-lpthread", "-lm"]

[crates.verify]
ignore_ephemeral = [
  "crates/edax-py/.alef/**",
  "crates/edax-go/internal/native/cmd/**",
  "crates/edax-go/internal/native/generate.go",
  "crates/edax-go/internal/native/native_setup.go",
]
