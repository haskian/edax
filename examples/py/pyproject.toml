# Runnable env for the Python examples. `uv sync` here builds the local edax SDK (maturin), so the
# examples run without a manual maturin/pip dance:
#
#   cd examples/py && uv sync && uv run python 01_command_bus.py
[project]
name = "edax-examples"
version = "0"
requires-python = ">=3.10"
dependencies = [
    # The local edax SDK. `test` brings pytest for 18 and 19. `redis` and `kafka` bring the clients
    # 16 and 17 use when EDAX_REDIS_URL or EDAX_KAFKA_BOOTSTRAP is set.
    "edax[kafka,redis,test]",
]

[tool.uv.sources]
edax = { path = "../../crates/edax-py", editable = true }

[tool.uv]
package = false  # this dir is a bag of scripts, not an installable package — don't build it
